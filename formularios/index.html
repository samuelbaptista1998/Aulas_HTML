<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>
  <body>
    <h1>Formulário HTML</h1>

    <form>
      <label for="nome">Nome:</label>
      <input
        type="text"
        name=""
        id="nome"
        value=""
        placeholder="ex: Antonio Carlos"
      />
      <br />
      <br />

      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name=""
        placeholder="exemplo@exemplo.com.br"
      />
      <br />
      <br />

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua Senha" />
      <br />
      <br />

      <label for="">Gênero:</label>
      <input type="radio" name="genero" id="masculino" value="masculino" />
      <label for="masculino">Masculino</label>

      <input type="radio" name="genero" id="feminino" value="feminino" />
      <label for="feminino">Feminino</label>

      <input type="radio" name="genero" id="outros" value="outros" />
      <label for="outros">Outros</label>

      <br />
      <br />

      <span>Estilo Musical: </span>
      <br />

      <input
        type="checkbox"
        name="estiloMusical"
        id="estiloMusicalPop"
        value="pop"
      />
      <label for="estiloMusicalPop">Pop</label>
      <br />

      <input
        type="checkbox"
        name="estiloMusical"
        id="estiloMusicalRock"
        value="rock"
      />
      <label for="estiloMusicalRock">Rock</label>
      <br />

      <input
        type="checkbox"
        name="estiloMusical"
        id="estiloMusicalSertanejo"
        value="sertanejo"
      />
      <label for="estiloMusicalSertanejo">Sertanejo</label>
      <br />

      <input
        type="checkbox"
        name="estiloMusical"
        id="estiloMusicalSamba"
        value="samba"
      />
      <label for="estiloMusicalSamba">Samba</label>
      <br />

      <input
        type="checkbox"
        name="estiloMusical"
        id="estiloMusicalGospel"
        value="gospel"
      />
      <label for="estiloMusicalGospel">Gospel</label>
      <br />

      <input
        type="checkbox"
        name="estiloMusical"
        id="estiloMusicalForro"
        value="forro"
      />
      <label for="estiloMusicalForro">Forró</label>

      <br />
      <br />

      <label for="descricaoId">Descrição:</label>
      <textarea
        name="descricao"
        id="descricaoId"
        placeholder="Digite uma Descrição"
      ></textarea>
      <!-- textarea abre uma caixa de texto para o usuario digitar -->

      <br />
      <br />

      <label for="">Selecione um Estado:</label>
      <select name="estados" id="estadosID">
        <option value="">Selecione seu Estado</option>
        <option value="sp">São Paulo(SP)</option>
        <option value="rj">Rio De Janeiro(RJ)</option>
        <option value="ms">Mato Grosso Do Sul(MS)</option>
        <option value="mt">Mato Grosso(MT)</option>
        <option value="mg">Minas Gerais(MG)</option>
        <option value="ba">Bahia(BA)</option>
        <option value="go">Goias(GO)</option>
        <option value="to">Tocantins(TO)</option>
        <option value="pa">Pará(PA)</option>
        <option value="am">Amazonas(AM)</option>
        <option value="se">Sergipe(SE)</option>
        <option value="ma">Maranhão(MA)</option>
        <option value="df">Distrito Federal(DF)</option>
        <option value="ap">Amapá(AP)</option>
        <option value="ac">Acre(AC)</option>
        <option value="ro">Rondônia(RO)</option>
        <option value="rr">Roraima(RR)</option>
      </select>
      <!-- select abre pro usuario seleceionar em forma de 'lista' -->

      <br />
      <br />

      <fieldset>
        <legend>Dados Pessoais:</legend>

        <label for="nomeCompletoId">Nome Completo:</label>
        <input type="text" name="nomeCompleto" id="nomeCompletoId" />

        <label for="dataNascimentoId">Data de Nascimento</label>
        <input type="date" name="dataNascimento" id="dataNascimentoId" />
      </fieldset>
      <!-- fieldset agrupa seções dos formularios -->

      <br />
      <br />

      <button type="submit">Enviar</button>
      <!-- <input type="submit" value="Enviar"> -->
    </form>
  </body>
</html>
