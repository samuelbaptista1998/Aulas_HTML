<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Formulario Exercicio 01 login Trello</title>
    <script src="https://unpkg.com/@codans/trello"></script>
  </head>
  <body>
    <figure>
      <img
        src="../formulario_exercicio_01/img/trello.svg"
        alt="logo trello"
        width="200"
      />
    </figure>
    <h1>Fazer Login no Trello</h1>
    <form action="">
      <label for="email"></label>
      <input type="email" id="email" name="" placeholder="Digite seu Email" />

      <label for="senha"></label>
      <input type="password" id="senha" placeholder="Digite sua Senha" />
      <button type="submit">Fazer Login</button>

      ou

      <button type="submit">
        <img
          src="../formulario_exercicio_01/img/google.svg"
          alt="logo google"
          width="25"
        />Continuar com o Google
      </button>

      <button type="submit">
        <img
          src="../formulario_exercicio_01/img/microsoft.svg"
          alt="logo microsoft"
          width="25"
        />Continuar com Microsoft
      </button>
      <button type="submit">
        <img
          src="../formulario_exercicio_01/img/apple.svg"
          alt="logo apple"
          width="25"
        />Continuar com a Apple
      </button>
      <button type="submit">
        <img
          src="../formulario_exercicio_01/img/slack.svg"
          alt="logo slack"
          width="25"
        />Continuar com o Slack
      </button>
    </form>
    <img
      src="../formulario_exercicio_01/img/atlassian.svg"
      alt="logo atlassian"
      width="300"
    />

    <img
      src="../formulario_exercicio_01/img/analytics.svg"
      alt="imagem analytics"
      width="300"
    />
    <img
      src="../formulario_exercicio_01/img/interactive.svg"
      alt="imagem interativa"
      width="300"
    />
  </body>
</html>
