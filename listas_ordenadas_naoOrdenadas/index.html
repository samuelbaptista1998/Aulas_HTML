<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listas ordenadas e não ordenadas</title>
  </head>
  <body>
    <!-- 
    ul -> unordered list (listas não ordenadas)
    ol -> ordered list (listas ordenadas)
    li -> list item (item de lista) 
    -->
    <ul>
        <li>Casa</li>
        <li>Banheiro</li>
        <li>Cozinha
            <ul>
                <li>Talheres</li>
                <li>Louça</li>
            </ul>
        </li>
    </ul>
    <ol type="I">
        <li>Banana</li>
        <li>Maçã</li>
        <li>Uva
            <ol>
                <li>1</li>
                <li>2</li>
            </ol>
        </li>
    </ol>
  </body>
</html>
