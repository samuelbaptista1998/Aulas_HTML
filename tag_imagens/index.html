<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tag de imagem</title>
  </head>
  <body>
    <h1>Tag de imagens</h1>

    <!-- 
        img - Imagem
        scr - Source (origem, fonte)
        alt - altertnative
     -->
    <figure>
      <img
        src="../imagens/praia.jpg"
        alt="imagem de praia "
        width="500"
        title="Imagem de praia vista do alto"
      />
      <figcaption>Imagem de praia</figcaption>
    </figure>
  </body>
</html>
